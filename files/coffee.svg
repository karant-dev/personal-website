<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ec" />
      <stop offset="100%" stop-color="#f5e6d3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bg)" />

  <!-- Cat Body / Ears -->
  <g id="cat" transform="translate(0, 10)">
    <!-- Ears -->
    <polygon points="120,130 90,40 170,95" fill="#6f4e37" />
    <polygon points="123,120 100,55 160,95" fill="#f7cac9" />

    <polygon points="280,130 310,40 230,95" fill="#6f4e37" />
    <polygon points="277,120 300,55 240,95" fill="#f7cac9" />

    <!-- Head -->
    <ellipse cx="200" cy="190" rx="110" ry="95" fill="#8d6e63" filter="url(#shadow)" />

    <!-- Muzzle / Cheek highlights -->
    <ellipse cx="170" cy="225" rx="36" ry="26" fill="#d7ccc8" />
    <ellipse cx="230" cy="225" rx="36" ry="26" fill="#d7ccc8" />

    <!-- Eyes -->
    <ellipse cx="155" cy="175" rx="14" ry="18" fill="#2d3748" />
    <ellipse cx="245" cy="175" rx="14" ry="18" fill="#2d3748" />
    <circle cx="151" cy="170" r="5" fill="#ffffff" />
    <circle cx="241" cy="170" r="5" fill="#ffffff" />
    <circle cx="158" cy="180" r="2.5" fill="#ffffff" />
    <circle cx="248" cy="180" r="2.5" fill="#ffffff" />

    <!-- Nose -->
    <polygon points="200,215 190,202 210,202" fill="#e57373" />

    <!-- Mouth -->
    <path d="M 190,218 Q 180,230 170,225" stroke="#4a3728" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 210,218 Q 220,230 230,225" stroke="#4a3728" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Whiskers Left -->
    <line x1="140" y1="215" x2="60" y2="205" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="135" y1="225" x2="55" y2="228" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="140" y1="235" x2="65" y2="248" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Whiskers Right -->
    <line x1="260" y1="215" x2="340" y2="205" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="265" y1="225" x2="345" y2="228" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="260" y1="235" x2="335" y2="248" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Paws resting at bottom -->
    <ellipse cx="145" cy="305" rx="32" ry="24" fill="#6f4e37" />
    <ellipse cx="255" cy="305" rx="32" ry="24" fill="#6f4e37" />

    <!-- Coffee Bean forehead patch -->
    <ellipse cx="200" cy="140" rx="10" ry="14" fill="#4a3728" transform="rotate(-15 200 140)" />
    <path d="M 197,128 Q 203,140 197,152" stroke="#d7ccc8" stroke-width="1.5" fill="none" />
  </g>

  <!-- Tag / Label -->
  <text x="200" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#6f4e37" text-anchor="middle" letter-spacing="1">☕ COFFEE</text>
</svg>
